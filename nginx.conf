server {
  listen 80;
  server_name _ default_server;

  root /usr/share/nginx/html;

  # index.html (and every SPA route, which falls back to it) must be revalidated on each load: it
  # points to the hashed bundles of the current deploy. Without a Cache-Control header the browser
  # cached it heuristically and kept serving the previous release's bundle after a deploy.
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }

  # Build output with a content hash in the file name (static/js, static/css, static/media): a new
  # deploy always produces new names, so these can be cached for a year. No "always": a 404 for a
  # missing file must not be cached for a year.
  location /static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
}
